<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog | Finance With Aishik{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --navy-blue: #0A192F; 
            --gold: #C5A059; 
            --text-light: #E0E0E0; 
        }
        
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Lato', sans-serif; 
            background-color: var(--navy-blue); 
            color: var(--text-light); 
            line-height: 1.8; 
            overflow-x: hidden; 
        }

        .article-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 5% 100px 5%;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--gold);
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 30px;
            transition: opacity 0.3s;
        }
        .back-link:hover { opacity: 0.8; }

        /* Common Blog Styles */
        .article-header { text-align: center; margin-bottom: 40px; }
        .category-badge {
            display: inline-block;
            background: rgba(197, 160, 89, 0.15);
            color: var(--gold);
            padding: 6px 15px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }
        
        .article-title {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            color: #FFFFFF;
            margin: 0 0 20px 0;
            line-height: 1.3;
        }
        
        .article-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            color: #a0aec0;
            font-size: 14px;
        }
        .article-meta i { color: var(--gold); margin-right: 5px; }

        .hero-img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            object-position: top;
            border-radius: 12px;
            margin-bottom: 50px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .article-body { font-size: 18px; color: #d1d5db; }
        .article-body p { margin-bottom: 25px; }
        .article-body b, .article-body strong { color: #FFFFFF; }
    </style>

    <!-- এই ব্লকের ভেতরে আপনি নির্দিষ্ট ব্লগের জন্য এক্সট্রা CSS অ্যাড করতে পারবেন -->
    {% block extra_css %}{% endblock %}

</head>
<body>

    {% include 'navbar.html' %}

    <div class="article-container">
        <a href="/blogs" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Blogs</a>
        
        <!-- এই ব্লকের ভেতরে আপনার নির্দিষ্ট ব্লগের কন্টেন্ট বসবে -->
        {% block content %}{% endblock %}
        
    </div>

</body>
</html>
