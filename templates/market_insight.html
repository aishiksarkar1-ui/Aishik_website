<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Market Insight | Finance With Aishik</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --navy-blue: #0A192F; --gold: #C5A059; --text-light: #E0E0E0; --teal: #2A9D8F; }
        body { margin: 0; padding: 0; font-family: 'Lato', sans-serif; background-color: var(--navy-blue); color: var(--text-light); line-height: 1.6; overflow-x: hidden; }

        /* Custom Ticker Tape Section */
        .custom-ticker-wrap { width: 100%; background: rgba(0, 0, 0, 0.4); border-bottom: 1px solid rgba(197, 160, 89, 0.3); overflow: hidden; padding: 12px 0; white-space: nowrap; box-sizing: border-box; }
        .ticker-move { display: inline-block; animation: ticker 25s linear infinite; }
        .ticker-move:hover { animation-play-state: paused; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
        
        .ticker-item { display: inline-block; padding: 0 35px; font-size: 15px; font-weight: bold; color: #E0E0E0; border-right: 1px solid rgba(255,255,255,0.1); }
        .ticker-price { margin-left: 8px; font-family: 'Lato', sans-serif; }
        .ticker-up { color: #38ef7d; font-size: 13px; margin-left: 5px; }
        .ticker-down { color: #ffb3b3; font-size: 13px; margin-left: 5px; }

        /* Page Header */
        .page-header { text-align: center; padding: 50px 20px 30px 20px; position: relative; z-index: 10; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 38px; color: var(--gold); margin: 0 0 10px 0; letter-spacing: 1px; }
        .page-header p { font-size: 15px; max-width: 650px; margin: 0 auto; color: #a0aec0; }

        /* Main Dashboard Grid */
        .dashboard-container { padding: 20px 40px 80px 40px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; max-width: 1300px; margin: 0 auto; }

        /* Glassmorphism Cards */
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); border-top: 1px solid rgba(197, 160, 89, 0.3); border-radius: 16px; padding: 25px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); }
        
        .panel-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--gold); margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 10px; }

        /* Widget Containers */
        .widget-box { width: 100%; height: 600px; border-radius: 8px; overflow: hidden; }
        
        /* Custom News Scrollbar */
        .custom-news-box { height: 600px; overflow-y: auto; padding-right: 10px; }
        .custom-news-box::-webkit-scrollbar { width: 6px; }
        .custom-news-box::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
        .custom-news-box::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }

        .news-item { border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; margin-bottom: 15px; transition: 0.3s; }
        .news-item:hover { background: rgba(255,255,255,0.02); border-radius: 6px; padding-left: 5px; }
        .news-date { font-size: 12px; color: var(--teal); margin-bottom: 5px; font-weight: bold; }
        .news-title { color: var(--text-light); text-decoration: none; font-size: 16px; font-weight: bold; display: block; margin-bottom: 5px; transition: color 0.3s; line-height: 1.4; }
        .news-title:hover { color: var(--gold); }
        .news-desc { font-size: 13.5px; color: #a0aec0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; padding: 20px; }
            .widget-box, .custom-news-box { height: 500px; }
        }
    </style>
</head>
<body>

    {% include 'navbar.html' %}

    <!-- 1. Custom Live Ticker Tape (Yahoo Finance Data) -->
    <div class="custom-ticker-wrap">
        <div class="ticker-move" id="live-ticker-box">
            <span style="color: var(--gold); margin-left: 20px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading Live NSE Data...</span>
        </div>
    </div>

    <div class="page-header">
        <h1>Global & Domestic Market Pulse</h1>
        <p>Track live Indian indices and stay updated with top financial stories breaking right now. Data updates automatically in real-time.</p>
    </div>

    <div class="dashboard-container">
        
        <!-- 2. Market Overview Chart (BSE Symbols Fix) -->
        <div class="glass-panel">
            <h2 class="panel-title"><i class="fa-solid fa-chart-line"></i> Indian Indices Overview</h2>
            <div class="widget-box">
                <div class="tradingview-widget-container">
                  <div class="tradingview-widget-container__widget"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
                  {
                  "colorTheme": "dark",
                  "dateRange": "1M",
                  "showChart": true,
                  "locale": "in",
                  "width": "100%",
                  "height": "100%",
                  "largeChartUrl": "",
                  "isTransparent": true,
                  "showSymbolLogo": true,
                  "showFloatingTooltip": true,
                  "tabs": [
                    {
                      "title": "Top Indices",
                      "symbols": [
                        { "s": "BSE:SENSEX", "d": "BSE Sensex" },
                        { "s": "BSE:BANKEX", "d": "BSE Bankex" },
                        { "s": "BSE:BSE500", "d": "BSE 500" },
                        { "s": "BSE:BSEMID", "d": "BSE Midcap" },
                        { "s": "BSE:RELIANCE", "d": "Reliance Ind." }
                      ]
                    }
                  ]
                }
                  </script>
                </div>
            </div>
        </div>

        <!-- 3. Economic Times Live RSS Feed -->
        <div class="glass-panel">
            <h2 class="panel-title">
                <i class="fa-regular fa-newspaper"></i> 
                Economic Times - Live
                <img src="https://img.etimg.com/photo/msid-74451948,quality-100/et-logo.jpg" alt="ET Logo" style="height: 20px; border-radius: 4px; margin-left: auto;">
            </h2>
            <div class="custom-news-box" id="et-news-container">
                <div style="text-align: center; color: var(--gold); margin-top: 50px;">
                    <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                    <p style="margin-top: 10px;">Fetching latest news from ET...</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Fetch Data from our Flask Backend (market_data.py) for the Ticker
        fetch('/api/live-ticker')
            .then(response => response.json())
            .then(data => {
                let tickerHtml = '';
                data.forEach(item => {
                    let isUp = item.change >= 0;
                    let colorClass = isUp ? 'ticker-up' : 'ticker-down';
                    let icon = isUp ? '<i class="fa-solid fa-caret-up"></i>' : '<i class="fa-solid fa-caret-down"></i>';
                    let sign = isUp ? '+' : '';
                    
                    tickerHtml += `
                        <div class="ticker-item">
                            ${item.name} 
                            <span class="ticker-price">₹${item.price.toLocaleString('en-IN')}</span> 
                            <span class="${colorClass}">${icon} ${sign}${item.change_percent}%</span>
                        </div>`;
                });
                // Doubled for seamless infinite scroll
                document.getElementById('live-ticker-box').innerHTML = tickerHtml + tickerHtml;
            })
            .catch(err => console.log("Error loading ticker: ", err));

        // RSS to JSON API for Economic Times Markets Feed
        const rssUrl = 'https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms';
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('et-news-container');
                container.innerHTML = ''; 
                
                if(data.status === 'ok') {
                    // Show top 15 news items
                    data.items.slice(0, 15).forEach(item => {
                        const newsDate = new Date(item.pubDate).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                        const cleanDesc = item.description.replace(/<[^>]+>/g, '');

                        const newsHtml = `
                            <div class="news-item">
                                <div class="news-date"><i class="fa-regular fa-clock"></i> ${newsDate}</div>
                                <a href="${item.link}" target="_blank" class="news-title">
                                    ${item.title}
                                </a>
                                <div class="news-desc">
                                    ${cleanDesc}
                                </div>
                            </div>
                        `;
                        container.innerHTML += newsHtml;
                    });
                } else {
                    container.innerHTML = '<p style="color: #ffb3b3;">Failed to load latest news at the moment.</p>';
                }
            })
            .catch(error => {
                document.getElementById('et-news-container').innerHTML = '<p style="color: #ffb3b3;">Error connecting to news server.</p>';
            });
    </script>

</body>
</html>
