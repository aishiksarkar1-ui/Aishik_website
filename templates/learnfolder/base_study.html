<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinXHorizon Study Center</title>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 
          MASTER CSS FOR ALL STUDY MODULES 
        */
        body {
            margin: 0;
            padding: 0;
            background-color: #0A192F;
        }
        .study-container {
            background-color: #0A192F; 
            color: #f0f0f0; 
            padding: 60px 20px;
            font-family: 'Arial', sans-serif;
            line-height: 1.8;
            min-height: 100vh;
        }
        .study-content {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.03);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }
        .study-header h1 {
            color: #C5A059; 
            font-size: 2.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(197, 160, 89, 0.3);
            padding-bottom: 15px;
        }
        .study-header p.intro-text {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 40px;
            font-style: italic;
        }
        .study-section h2 {
            color: #C5A059;
            font-size: 1.8rem;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        .study-section p {
            margin-bottom: 20px;
            font-size: 1.05rem;
        }
        .farman-box {
            background-color: #FFFFF0; 
            color: #0A192F;
            padding: 25px;
            border-left: 6px solid #C5A059;
            margin: 30px 0;
            border-radius: 4px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .farman-box strong {
            color: #8b6d3b;
            font-size: 1.1rem;
        }
        .study-list {
            list-style-type: none;
            padding-left: 0;
        }
        .study-list li {
            margin-bottom: 15px;
            padding-left: 30px;
            position: relative;
        }
        .study-list li::before {
            content: "►";
            color: #C5A059;
            position: absolute;
            left: 0;
            font-size: 1rem;
            top: 2px;
        }
        .study-list strong {
            color: #C5A059;
        }
        .study-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 60px;
            border-top: 1px solid rgba(197, 160, 89, 0.3);
            padding-top: 30px;
        }
        .nav-btn {
            background-color: #C5A059;
            color: #0A192F;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background-color: #FFFFF0;
            color: #0A192F;
        }
    </style>
</head>
<body>

    <!-- Note: Apnar website er jodi kono Navbar/Header theke thake, 
         tahole tar code ti ekhane boshiye dite paren -->

    <div class="study-container">
        <div class="study-content">
            
            <!-- Ei block er bhitorei module_1, module_2 er lekha gulo dynamically ashbe -->
            {% block study_content %}
            {% endblock %}

        </div>
    </div>

</body>
</html>
