<!-- templates/learnfolder/base_study.html -->
{% extends "base.html" %}

{% block title %}FinXHorizon Study Center{% endblock %}

{% block content %}
<style>
    /* 
      MASTER CSS FOR ALL STUDY MODULES 
      Apnake ar kono page-e ei CSS likhte hobe na.
    */
    .study-container {
        background-color: #0A192F; 
        color: #f0f0f0; 
        padding: 60px 20px;
        font-family: 'Arial', sans-serif;
        line-height: 1.8;
        min-height: 80vh;
    }
    .study-content {
        max-width: 900px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.03);
        padding: 40px;
        border-radius: 12px;
        border: 1px solid rgba(197, 160, 89, 0.3);
    }
    .study-header h1 {
        color: #C5A059; 
        font-size: 2.5rem;
        margin-bottom: 20px;
        border-bottom: 2px solid rgba(197, 160, 89, 0.3);
        padding-bottom: 15px;
    }
    .study-header p.intro-text {
        font-size: 1.1rem;
        color: #cccccc;
        margin-bottom: 40px;
        font-style: italic;
    }
    .study-section h2 {
        color: #C5A059;
        font-size: 1.8rem;
        margin-top: 40px;
        margin-bottom: 20px;
    }
    .study-section p {
        margin-bottom: 20px;
        font-size: 1.05rem;
    }
    /* Ivory Farman CTA Section */
    .farman-box {
        background-color: #FFFFF0; 
        color: #0A192F;
        padding: 25px;
        border-left: 6px solid #C5A059;
        margin: 30px 0;
        border-radius: 4px;
        font-weight: 500;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .farman-box strong {
        color: #8b6d3b;
        font-size: 1.1rem;
    }
    .study-list {
        list-style-type: none;
        padding-left: 0;
    }
    .study-list li {
        margin-bottom: 15px;
        padding-left: 30px;
        position: relative;
    }
    .study-list li::before {
        content: "►";
        color: #C5A059;
        position: absolute;
        left: 0;
        font-size: 1rem;
        top: 2px;
    }
    .study-list strong {
        color: #C5A059;
    }
    /* Next/Previous Button Styling */
    .study-navigation {
        display: flex;
        justify-content: space-between;
        margin-top: 60px;
        border-top: 1px solid rgba(197, 160, 89, 0.3);
        padding-top: 30px;
    }
    .nav-btn {
        background-color: #C5A059;
        color: #0A192F;
        padding: 12px 25px;
        text-decoration: none;
        font-weight: bold;
        font-size: 1rem;
        border-radius: 5px;
        transition: all 0.3s ease;
    }
    .nav-btn:hover {
        background-color: #FFFFF0;
        color: #0A192F;
    }
    .nav-btn.disabled {
        background-color: #333;
        color: #777;
        pointer-events: none;
    }
</style>

<div class="study-container">
    <div class="study-content">
        
        <!-- Ei block er bhitorei asol lekha gulo dynamically ashbe -->
        {% block study_content %}
        {% endblock %}

    </div>
</div>
{% endblock %}
